services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      api:
        condition: service_healthy